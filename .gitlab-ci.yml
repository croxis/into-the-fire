image: registry.gitlab.com/croxis/itf:4.7.2.custom

# NOTE: the `cd` command in each build stage is not necessary if your
# project.godot is at the repo root

# Cache imported assets between runs
cache:
  key: import-assets
  paths:
    - .godot/imported

stages:
  - import-assets
  - test
  - export
  - deploy

variables:
  EXPORT_NAME: itf
  PROJECT_PATH: itf
  LINK_ARTIFACT: 'true'

# Open the editor to import assets in case the cache was empty or outdated
import-assets:
  stage: import-assets
  script:
    - godot --verbose --headless --import --editor --quit

# GUT unit tests through tests/run.sh: a short job log, and the job fails when a
# test script doesn't load (plain GUT skips it). The full GUT log is kept as
# gut.log. Results show on merge requests via the JUnit report.
unit-tests:
  stage: test
  before_script:
    - godot --headless --import
  script:
    - mkdir -p test-results
    - TEST_LOG=test-results/gut.log GODOT=godot tests/run.sh -gjunit_xml_file=res://test-results/junit.xml
  artifacts:
    when: always
    paths:
      - test-results/gut.log
    reports:
      junit: test-results/junit.xml

# Boots the dedicated server headless and fails on unexpected errors.
server-smoke:
  stage: test
  before_script:
    - godot --headless --import
  script:
    - SMOKE_LOG=smoke.log GODOT=godot tests/smoke/server_smoke.sh
  artifacts:
    when: always
    paths:
      - smoke.log

# A dedicated server and a test player that joins, picks a faction and launches,
# both headless over a real ENet connection. Fails on a missing join step or an
# unexpected error in either log.
join-smoke:
  stage: test
  before_script:
    - godot --headless --import
  script:
    - JOIN_LOGS=join-logs GODOT=godot tests/smoke/join_smoke.sh
  artifacts:
    when: always
    paths:
      - join-logs/

linux:
  stage: export
  script:
    - mkdir -v -p export/linux
    - EXPORT_DIR="$(readlink -f build)"
    - ls -lah .
    - godot -v --headless --export-debug "Linux/X11" export/linux/$EXPORT_NAME.x86_64
    - ls -lah
    - cp README.md export/linux/
    - cp CREDITS.md export/linux/
  artifacts:
    name: $EXPORT_NAME-$CI_JOB_NAME
    paths:
      - export/linux

windows:
  stage: export
  script:
    - mkdir -v -p export/windows
    - godot -v --headless --export-debug "Windows Desktop" export/windows/$EXPORT_NAME.exe
    - ls -lah
    - cp README.md export/windows/
    - cp CREDITS.md export/windows/
  artifacts:
    name: $EXPORT_NAME-$CI_JOB_NAME
    paths:
      - export/windows

